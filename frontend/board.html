<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-graphy · Board</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <a class="site-name" href="/">i-graphy</a>
</header>
<main class="page-content">
    <section class="board-header">
        <a class="button button-primary" href="/new-post">새 글 작성</a>
        <form id="search-form" class="search-form">
            <label class="sr-only" for="search-type">검색 조건</label>
            <select id="search-type" name="search_type">
                <option value="title">제목</option>
                <option value="content">내용</option>
                <option value="title_content">제목+내용</option>
            </select>
            <label class="sr-only" for="search-input">검색어</label>
            <input id="search-input" name="search" type="search" placeholder="검색어">
            <button class="button" type="submit">검색</button>
        </form>
    </section>

    <section aria-live="polite">
        <div id="board-list"></div>
        <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
    </section>
</main>
<footer>Copyright 2026 An, Hyeokkyun. All rights reserved.</footer>
<script src="/js/board.js"></script>
</body>
</html>
