
name: Keep i-graphy Alive

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping i-graphy
        run: |
          curl --fail --silent --show-error --location --max-time 120 \
            "https://i-graphy.onrender.com/" \
            --output /dev/null
